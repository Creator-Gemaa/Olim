name: Build RealCM 0.3.1 Windows installer

on:
  push:
    branches: [realcm-setup-build]
    paths:
      - 'realcm-source/READY'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble and extract app source
        shell: pwsh
        run: |
          $parts = Get-ChildItem realcm-source -Filter 'part-*.b64' | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 source parts, found $($parts.Count)." }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $archive = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\realcm-source.tar.gz", $archive)
          tar -xzf "$env:GITHUB_WORKSPACE\realcm-source.tar.gz" -C $env:GITHUB_WORKSPACE
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\realcm-app\package.json")) { throw 'RealCM source extraction failed.' }

      - name: Fix Electron production asset paths
        working-directory: realcm-app
        shell: pwsh
        run: |
          @'
          import { defineConfig } from 'vitest/config';
          import react from '@vitejs/plugin-react';

          export default defineConfig({
            base: './',
            plugins: [react()],
            server: { host: '127.0.0.1', port: 5173, strictPort: true },
            test: { environment: 'node' }
          });
          '@ | Set-Content -Path vite.config.ts -Encoding utf8

      - name: Set release version
        working-directory: realcm-app
        run: npm version 0.3.1 --no-git-tag-version

      - name: Install dependencies
        working-directory: realcm-app
        run: npm install --no-audit --no-fund

      - name: Create runtime environment template
        working-directory: realcm-app
        shell: pwsh
        run: Copy-Item .env.example .env.local -Force

      - name: Fix invalid JSON escaping in Windows path test
        working-directory: realcm-app
        shell: pwsh
        run: |
          @'
          import { describe, expect, it } from 'vitest';
          import { parseGeneratedFiles } from './workspace';

          describe('parseGeneratedFiles', () => {
            it('parses a JSON response wrapped in a markdown code fence', () => {
              const files = parseGeneratedFiles('```json\n{"files":[{"path":"src/App.tsx","content":"export default 1"}]}\n```');
              expect(files).toEqual([{ path: 'src/App.tsx', content: 'export default 1' }]);
            });

            it('normalizes Windows separators and removes a leading slash', () => {
              const files = parseGeneratedFiles(JSON.stringify({ files: [{ path: '/src\\components\\Card.tsx', content: 'ok' }] }));
              expect(files[0].path).toBe('src/components/Card.tsx');
            });

            it('rejects directory traversal', () => {
              expect(() => parseGeneratedFiles('{"files":[{"path":"../../outside.txt","content":"bad"}]}')).toThrow(/unsafe file path/i);
            });

            it('rejects unsupported path characters', () => {
              expect(() => parseGeneratedFiles('{"files":[{"path":"src/hello world.ts","content":"bad"}]}')).toThrow(/unsupported path characters/i);
            });

            it('rejects more than 30 files', () => {
              const files = Array.from({ length: 31 }, (_, index) => ({ path: `file-${index}.txt`, content: 'x' }));
              expect(() => parseGeneratedFiles(JSON.stringify({ files }))).toThrow(/between 1 and 30/i);
            });

            it('rejects invalid model output', () => {
              expect(() => parseGeneratedFiles('not JSON')).toThrow();
              expect(() => parseGeneratedFiles('{"items":[]}')).toThrow(/files array/i);
            });
          });
          '@ | Set-Content -Path src/lib/workspace.test.ts -Encoding utf8

      - name: Remove unused overview state
        working-directory: realcm-app
        shell: pwsh
        run: |
          $path = 'src/App.tsx'
          $source = Get-Content $path -Raw
          $source = [regex]::Replace($source, '(?m)^\s*const \[usage, setUsage\] = useState\(0\);\r?\n', '')
          Set-Content -Path $path -Value $source -Encoding utf8

      - name: Run tests
        working-directory: realcm-app
        run: npm test

      - name: Build application
        working-directory: realcm-app
        run: npm run build

      - name: Verify Electron-relative asset paths
        working-directory: realcm-app
        shell: pwsh
        run: |
          $html = Get-Content dist/index.html -Raw
          if ($html -notmatch 'src="./assets/' -or $html -notmatch 'href="./assets/') {
            throw 'Production assets are not relative. The Electron file:// window would not load the UI.'
          }

      - name: Package Windows installer
        working-directory: realcm-app
        run: npm run desktop:package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RealCM-Setup-0.3.1-Windows-x64
          path: realcm-app/release/RealCM-Setup-0.3.1.exe
          if-no-files-found: error
          retention-days: 30
