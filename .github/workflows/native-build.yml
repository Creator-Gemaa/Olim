name: VYRA native installers

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'electron/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'vite.config.ts'
      - '.env.production'
      - '.github/workflows/native-build.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyra-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Set Android app version
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          version = json.loads(Path("package.json").read_text())["version"]
          major, minor, patch = (int(part) for part in version.split("."))
          version_code = major * 1000000 + minor * 1000 + patch
          gradle_file = Path("android/app/build.gradle")
          source = gradle_file.read_text()
          source, code_count = re.subn(r"(?m)^(\\s*versionCode)\\s+\\d+", rf"\\1 {version_code}", source, count=1)
          source, name_count = re.subn(r"(?m)^(\\s*versionName)\\s+[\"']([^\"']*)[\"']", lambda match: f'{match.group(1)} "{version}"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not set Android versionCode/versionName in android/app/build.gradle")
          gradle_file.write_text(source)
          print(f"Android versionName={version}; versionCode={version_code}")
          PY
      - name: Generate Android icon and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0B1020" --splashBackgroundColor "#0B1020"
      - name: Sync Android project
        run: npx cap sync android
      - name: Build APK
        run: chmod +x android/gradlew && cd android && ./gradlew --no-daemon assembleDebug
      - name: Prepare APK download
        run: mkdir -p release && cp android/app/build/outputs/apk/debug/app-debug.apk release/VYRA-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vyra-android
          path: release/VYRA-Android.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Package Windows installer
        run: npm run desktop:package
      - name: Prepare EXE download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "electron-builder did not create an EXE installer" }
          if ($installer.Name -ne "VYRA-Setup.exe") { Copy-Item $installer.FullName "release/VYRA-Setup.exe" -Force }
          if (-not (Test-Path "release/latest.yml")) { throw "electron-builder did not create latest.yml; Windows auto-update cannot work" }
          $blockmap = "release/VYRA-Setup.exe.blockmap"
          if (-not (Test-Path $blockmap)) { throw "electron-builder did not create the Windows installer blockmap" }
      - uses: actions/upload-artifact@v4
        with:
          name: vyra-windows
          path: |
            release/VYRA-Setup.exe
            release/VYRA-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish VYRA installers
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Read VYRA app version
        id: app-version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vyra-latest
          name: VYRA v${{ steps.app-version.outputs.value }} — Latest installers
          target_commitish: main
          body: |
            VYRA v${{ steps.app-version.outputs.value }} installers built from the latest main branch.

            - Android APK: debug-signed for direct installation/testing; not a Google Play Store release build.
            - Windows EXE: unsigned setup; Windows SmartScreen may warn that the publisher is unrecognized.
          files: |
            release/VYRA-Android.apk
            release/VYRA-Setup.exe
            release/VYRA-Setup.exe.blockmap
            release/latest.yml
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
